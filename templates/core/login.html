{% extends "base.html" %}
{% block title %}Connexion — Mini CRM{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg border border-gray-200 p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Connexion</h1>

    {% if form.errors %}
    <p class="text-sm text-red-600 mb-4">Identifiant ou mot de passe incorrect.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Identifiant</label>
            {{ form.username }}
        </div>
        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full bg-blue-600 text-white rounded-md py-2 font-medium hover:bg-blue-700">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}
