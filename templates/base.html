<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini CRM Ventes à Crédit{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <style>
        .htmx-indicator { opacity: 0; }
        .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-y-2">
            <a href="/" class="font-semibold text-lg">Mini CRM</a>
            <nav class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
                {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-gray-900">Tableau de bord</a>
                <a href="{% url 'client_list' %}" class="text-gray-600 hover:text-gray-900">Clients</a>
                <a href="{% url 'client_create' %}" class="text-gray-600 hover:text-gray-900">Nouveau client</a>
                <a href="{% url 'sale_create' %}" class="text-gray-600 hover:text-gray-900">Nouvelle vente</a>
                {% if user.role == "admin" %}
                <a href="{% url 'vendeur_account_list' %}" class="text-gray-600 hover:text-gray-900">Comptes vendeurs</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-gray-600 hover:text-gray-900">Déconnexion</button>
                </form>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
